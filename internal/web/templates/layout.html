<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>{{.Title}} - gmail-categorizer</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<div class="progress" hidden data-progress>
  <div class="progress-bar" role="progressbar" aria-label="Archive progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-progress-bar></div>
</div>
<header class="topbar">
  <a class="brand" href="/">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg>
    <span class="brand-name">gmail-categorizer</span>
    <span class="brand-mailbox">Inbox</span>
  </a>
  <div class="topbar-end">
    {{if .Username}}<span class="account">{{.Username}}</span>{{end}}
    <form method="post" action="/refresh" class="inline-form">
      {{block "refresh-filter" .}}{{end}}
      <button class="pill-button" type="submit" aria-label="Refresh">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"></path><path d="M21 3v5h-5"></path></svg>
        <span class="label">Refresh</span>
      </button>
    </form>
  </div>
</header>
<p class="progress-status" role="status" aria-live="polite" hidden data-progress-status></p>
<main>
{{template "content" .}}
</main>
<footer class="shortcuts">
{{block "shortcuts" .}}{{end}}
</footer>
</body>
</html>
